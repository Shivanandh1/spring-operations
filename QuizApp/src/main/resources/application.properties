
spring.application.name=QuizApp
spring.datasource.url=jdbc:postgresql://database-1.c6p0oiyc8xhg.us-east-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=admin1234
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# HikariCP tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000


# If your AWS RDS requires SSL, append ?sslmode=require to the JDBC URL above
